[test]
# Timeout for individual tests - increased for Windows compatibility and for the
# graph MCP tests, which load the ryu WASM backend and rebuild the derived corpus.
timeout = 30000

# Reduce memory usage during test runs to prevent WSL2 crashes
smol = true

# Redirect the graph cache into a throwaway directory (see src/test/preload.ts)
preload = ["./src/test/preload.ts"]

# Reduce concurrency to help with Windows file system contention
# Note: This is a future-proofing setting as Bun may add concurrency controls

[serve.static]
plugins = ["bun-plugin-tailwind"]